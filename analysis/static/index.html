<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hedge Trimmer — Match Prices</title>
<link rel="stylesheet" href="/style.css" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="app">
    <div id="search-bar">
      <input id="search" type="text" autocomplete="off" placeholder="Search ingested matches…" />
      <div id="suggestions" hidden></div>
    </div>
    <main id="detail">
      <div id="empty-state">Search for a match to view team share prices over time.</div>
      <div id="match-detail" hidden>
        <header id="match-header"></header>
        <div id="chart"></div>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
