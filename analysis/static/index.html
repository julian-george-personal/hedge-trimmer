<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>hedge trimmer</title>
<link rel="stylesheet" href="/base.css" />
<link rel="stylesheet" href="/explorer.css" />
<link rel="stylesheet" href="/analysis.css" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="page-body">
  <nav id="top-nav">
    <a class="nav-link" data-view="explorer" href="/explorer.html">Explorer</a>
    <a class="nav-link" data-view="analysis" href="/analysis.html">Analysis</a>
  </nav>
  <div id="explorer-view" class="view">
    <div id="explorer-root">
      <aside id="explorer-sidebar">
        <div id="explorer-search-bar">
          <input id="explorer-search" type="text" autocomplete="off" placeholder="Filter matches…" />
          <div id="explorer-date-filter">
            <label>Date range</label>
            <div class="date-inputs">
              <input id="explorer-date-from" type="date" aria-label="From date" />
              <span class="date-sep">–</span>
              <input id="explorer-date-to" type="date" aria-label="To date" />
            </div>
            <div class="date-presets">
              <button type="button" data-preset="today">Today</button>
              <button type="button" data-preset="week">This week</button>
              <button type="button" data-preset="month">This month</button>
              <button type="button" data-preset="all">All</button>
            </div>
          </div>
          <div id="total-volume-filter" class="range-filter">
            <label>Total volume <span id="total-volume-label" class="range-values">0</span></label>
            <div class="range-slider">
              <div class="range-track"></div>
              <div id="total-volume-fill" class="range-fill"></div>
              <input id="total-volume-min" type="range" min="0" max="1000" value="0" step="1" aria-label="Minimum total volume" />
              <input id="total-volume-max" type="range" min="0" max="1000" value="1000" step="1" aria-label="Maximum total volume" />
            </div>
          </div>
          <div id="pre-match-volume-filter" class="range-filter">
            <label>Pre-match volume <span id="pre-match-volume-label" class="range-values">0</span></label>
            <div class="range-slider">
              <div class="range-track"></div>
              <div id="pre-match-volume-fill" class="range-fill"></div>
              <input id="pre-match-volume-min" type="range" min="0" max="1000" value="0" step="1" aria-label="Minimum pre-match volume" />
              <input id="pre-match-volume-max" type="range" min="0" max="1000" value="1000" step="1" aria-label="Maximum pre-match volume" />
            </div>
          </div>
        </div>
        <div id="market-list">
          <div id="list-loading"><span class="spinner"></span>Loading matches…</div>
        </div>
        <div id="list-footer">
          <span id="list-count"></span>
          <button id="load-more" type="button" hidden>Load more</button>
        </div>
      </aside>
      <div id="sidebar-resize-handle"></div>
      <button id="sidebar-toggle" title="Toggle sidebar" aria-label="Hide sidebar">&lsaquo;</button>
      <main id="detail">
        <div id="empty-state">Select a match to view team share prices over time.</div>
        <div id="match-detail" hidden>
          <header id="match-header"></header>
          <div id="chart-container">
            <div id="chart"></div>
            <div id="chart-overlay"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="analysis-view" class="view" hidden>
    <div id="analysis-root">
      <aside id="analysis-sidebar">
        <div id="analysis-search-bar">
          <input id="analysis-search" type="text" autocomplete="off" placeholder="Filter matches…" />
          <div id="analysis-date-filter">
            <label>Date range</label>
            <div class="date-inputs">
              <input id="analysis-date-from" type="date" aria-label="From date" />
              <span class="date-sep">–</span>
              <input id="analysis-date-to" type="date" aria-label="To date" />
            </div>
            <div class="date-presets">
              <button type="button" data-preset="today">Today</button>
              <button type="button" data-preset="week">This week</button>
              <button type="button" data-preset="month">This month</button>
              <button type="button" data-preset="all">All</button>
            </div>
          </div>
          <label id="pandascore-filter" class="checkbox-label">
            <input id="only-pandascore-start" type="checkbox" />
            Only PandaScore match starts
          </label>
        </div>
        <div id="filter-summary"></div>
      </aside>
      <main id="analysis-app">
        <div id="widgets"></div>
      </main>
    </div>
  </div>
  <script src="/shared.js"></script>
  <script src="/explorer.js"></script>
  <script src="/analysis.js"></script>
  <script src="/app.js"></script>
</body>
</html>
