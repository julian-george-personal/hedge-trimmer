<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>hedge trimmer — analysis</title>
<link rel="stylesheet" href="/base.css" />
<link rel="stylesheet" href="/analysis.css" />
</head>
<body class="page-body">
  <nav id="top-nav">
    <a class="nav-link" href="/explorer.html">Explorer</a>
    <a class="nav-link active" href="/analysis.html">Analysis</a>
  </nav>
  <div id="app">
    <aside id="sidebar">
      <div id="search-bar">
        <input id="search" type="text" autocomplete="off" placeholder="Filter matches…" />
        <div id="date-filter">
          <label>Date range</label>
          <div class="date-inputs">
            <input id="date-from" type="date" aria-label="From date" />
            <span class="date-sep">–</span>
            <input id="date-to" type="date" aria-label="To date" />
          </div>
          <div class="date-presets">
            <button type="button" data-preset="today">Today</button>
            <button type="button" data-preset="week">This week</button>
            <button type="button" data-preset="month">This month</button>
            <button type="button" data-preset="all">All</button>
          </div>
        </div>
        <label id="pandascore-filter" class="checkbox-label">
          <input id="only-pandascore-start" type="checkbox" />
          Only PandaScore match starts
        </label>
      </div>
      <div id="filter-summary"></div>
    </aside>
    <main id="analysis-app">
      <div id="widgets"></div>
    </main>
  </div>
  <script src="/analysis.js"></script>
</body>
</html>
